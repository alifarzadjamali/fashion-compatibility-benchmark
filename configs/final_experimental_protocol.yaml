    revision: ea8dc2863c51be0a264bab82070e3e8836b02d51
    resolution: 224
    precision: bf16
  - key: clip_vitl14_336
    checkpoint: openai/clip-vit-large-patch14-336
    revision: ce19dc912ca5cd21c8a653c79e251e808ccabcd1
    resolution: 336
    precision: fp16
  - key: siglip2_b16_384
    checkpoint: google/siglip2-base-patch16-384
    revision: f775b65a79762255128c981547af89addcfe0f88
    resolution: 384
    precision: fp16
  - key: fashionclip2
    checkpoint: patrickjohncyh/fashion-clip
    revision: 7e3ba62ce16b379a1ab479346b66f192e76f51b7
    resolution: 224
    precision: fp16
  - key: marqo_fashionsiglip
    checkpoint: Marqo/marqo-fashionSigLIP
