protocol_name: repbench_fashion_final_v1_2
frozen_utc: "2026-09-13T00:00:00Z"
status: locked_before_iqon_or_a100_model_evaluation

hard_constraints:
  new_human_subjects: prohibited
  encoder_finetuning: prohibited
  new_representations: prohibited
  a100_training_or_tuning: prohibited
  test_driven_decisions: prohibited
  preserve_prior_artifacts: true

representations:
