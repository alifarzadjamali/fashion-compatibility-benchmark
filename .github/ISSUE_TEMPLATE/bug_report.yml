name: Bug report
description: Report a reproducible problem in repository code or documentation
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please do not include private datasets, source images, model weights, or credentials.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: State the observed behavior and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, configuration names, and the smallest safe input needed to reproduce the issue.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Repository revision
      description: Provide the output of `git rev-parse HEAD`.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, CUDA version (if relevant), and package-manager version.
    validations:
      required: true
