[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repbench-fashion"
version = "0.1.0"
description = "Controlled benchmark of frozen visual representations for outfit compatibility"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ftfy>=6,<7",
  "huggingface-hub>=0.34,<2",
  "joblib>=1.5,<2",
  "matplotlib>=3.10,<4",
  "numpy>=2.1,<3",
  "open-clip-torch>=3,<4",
  "pandas>=2.2,<3",
  "pillow>=11,<13",
  "pyarrow>=19,<24",
  "pyyaml>=6,<7",
  "scikit-learn>=1.6,<2",
  "tabulate>=0.9,<1",
  "torch==2.11.0+cu128",
  "torchvision==0.26.0+cu128",
  "transformers>=4.56,<5",
  "xgboost>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/repbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
